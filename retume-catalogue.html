<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>retume</title>
<style>
:root{--desk:#eceff4;--paper:#fff;--ink:#14213a;--muted:#5d6980;--sig:#ff5a1f;--shadow:rgba(20,33,58,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0c1424;--paper:#f6f7fa;--ink:#14213a;--muted:#5d6980;--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--desk:#0c1424;--paper:#f6f7fa;--ink:#14213a;--muted:#5d6980;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.book{height:min(70vh,560px);aspect-ratio:3/4;max-width:92vw;position:relative;perspective:1800px}
.page{position:absolute;inset:0;background:var(--paper);border-radius:16px 4px 4px 16px;box-shadow:0 14px 34px var(--shadow);transform-origin:right center;transition:transform .95s cubic-bezier(.55,.05,.25,1);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}
.page.flipped{transform:rotateY(180deg);pointer-events:none}
.page::before{content:"";position:absolute;inset:0 0 0 auto;width:14px;background:linear-gradient(270deg,rgba(20,33,58,.16),transparent);z-index:2}
.pic{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 22px 8px;min-height:0}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.ph{width:100%;height:100%;border:2px dashed #c3cad8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px}
.info{padding:6px 24px 22px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.info h2{margin:0;font-size:20px;line-height:1.3}
.price{font-size:20px;font-weight:700;color:var(--sig);white-space:nowrap}
.cover{background:var(--ink);color:#fff;justify-content:space-between;padding:30px 26px}
.cover h1{margin:0;font-size:34px;line-height:1.25}
.cover p{margin:8px 0 0;color:#b9c3d8;font-size:16px}
.cover svg{width:100%;height:auto;margin:auto 0}
.cover small{color:#b9c3d8;font-size:14px}
.bar{display:flex;align-items:center;gap:18px;direction:ltr}
.bar button{width:58px;height:58px;border-radius:50%;border:0;background:var(--sig);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 16px var(--shadow)}
.bar button:disabled{opacity:.3}
.bar button:focus-visible,.snd:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.count{min-width:70px;text-align:center;font-size:17px;color:var(--muted);direction:rtl}
.snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.page{transition-duration:.01s}}
.book{aspect-ratio:4/5;height:min(72vh,600px)}.pic{flex:0 0 auto;aspect-ratio:1/1;padding:0}.pic img{width:100%;height:100%;object-fit:cover;border-radius:0}.info{flex:1;padding:0 22px;align-items:center}.page.full{background:#3a3f43;align-items:center;justify-content:center}.page.full img{width:100%;height:auto;max-height:100%}
</style>
</head>

</div>

const book=document.getElementById("book"),ct=document.getElementById("ct"),nx=document.getElementById("nx"),pv=document.getElementById("pv"),sb=document.getElementById("snd");
let i=0,on=true,ac=null;
const els=PAGES.map((p,k)=>{
  const d=document.createElement("div");d.className="page"+(p.full?" full":"");d.style.zIndex=PAGES.length-k;
  if(p.full){const im=document.createElement("img");im.src=p.img;im.alt=p.name;d.appendChild(im)}else if(p.cover){
    d.innerHTML='<div><h1></h1><p></p></div><svg viewBox="0 0 300 140" fill="none" stroke-linecap="round"><path d="M10 100C60 10 110 10 150 70S240 130 290 40" stroke="#ff5a1f" stroke-width="14"/><path d="M10 100C60 10 110 10 150 70S240 130 290 40" stroke="#14213a" stroke-width="14" stroke-dasharray="3 9"/><rect x="0" y="86" width="26" height="28" rx="6" fill="#fff"/><rect x="274" y="26" width="26" height="28" rx="6" fill="#fff"/></svg><small>اسحب أو اضغط السهم لتقليب الصفحة</small>';
    d.querySelector("h1").textContent=p.title;d.querySelector("p").textContent=p.sub;
  }else{
    const pic=document.createElement("div");pic.className="pic";
    if(p.img){const im=document.createElement("img");im.src=p.img;im.alt=p.name;pic.appendChild(im)}
    else{const ph=document.createElement("div");ph.className="ph";ph.textContent=p.emoji||"📦";pic.appendChild(ph)}
    const inf=document.createElement("div");inf.className="info";
    const h=document.createElement("h2");h.textContent=p.name;
    const pr=document.createElement("span");pr.className="price";pr.textContent=p.price;
    inf.append(h,pr);d.append(pic,inf);
  }
  book.appendChild(d);return d;
});
function snd(){
  if(!on)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const n=Math.floor(ac.sampleRate*.5),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
    for(let k=0;k<n;k++){const t=k/n;a[k]=(Math.random()*2-1)*Math.sin(Math.PI*Math.pow(t,.6))*(1-t)}
    const s=ac.createBufferSource();s.buffer=b;
    const f=ac.createBiquadFilter();f.type="bandpass";f.Q.value=.7;
    f.frequency.setValueAtTime(900,ac.currentTime);f.frequency.exponentialRampToValueAtTime(4500,ac.currentTime+.45);
    const g=ac.createGain();g.gain.value=.55;
    s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  }catch(e){}
}
function ui(){ct.textContent=(i+1)+" / "+PAGES.length;nx.disabled=i>=PAGES.length-1;pv.disabled=i<=0}
function next(){if(i<PAGES.length-1){els[i].classList.add("flipped");i++;snd();ui()}}
function prev(){if(i>0){i--;els[i].classList.remove("flipped");snd();ui()}}
nx.onclick=next;pv.onclick=prev;
sb.onclick=()=>{on=!on;sb.textContent=on?"🔊":"🔇"};
let x0=null;
document.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-45)next();else if(dx>45)prev()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")next();if(e.key==="ArrowRight")prev()});
ui();
</script>
